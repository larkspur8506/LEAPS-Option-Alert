name: Test, Build and Push

on:
  push:
    branches: [ main, master ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'
  pull_request:
    branches: [ main, master ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'
  workflow_dispatch:

jobs:
  # 1. 测试门槛: 全部单元测试 (含安全/生命周期回归) 必须通过, 才允许构建镜像。
  #    历史 CI 只 build+push, 从未跑过测试, 回归只能靠人工发现。
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run unit tests
        env:
          # 测试使用固定密钥, 不依赖 data/.session_secret 落盘
          SESSION_SECRET: ci-test-session-secret
          TZ: America/New_York
        run: python -m unittest discover -s tests -v

  # 2. 构建并推送镜像 (测试通过后)
  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        # PR 只构建验证, 不推镜像 -> 无需登录 registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/qqq-option-alert
          tags: |
            type=raw,value=latest
            type=sha,prefix=
            type=ref,event=branch
            type=match,pattern=main,value=main

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          # 只有 master/main 的 push 才推镜像; PR 只构建验证, 不写 registry
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILD_DATE=${{ github.event.repository.created_at }}

  # 3. 发布摘要: 镜像由 GHCR 发布, 实际部署在自有主机执行
  #    (旧 deploy job 只在 runner 内 echo 文本并上传 artifact, 属于空转, 已移除)
  release-info:
    needs: build-and-push
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - name: Image summary
        run: |
          {
            echo "### 镜像已发布 :package:"
            echo ""
            echo "| 项 | 值 |"
            echo "| --- | --- |"
            echo "| 镜像 | ghcr.io/${{ github.repository_owner }}/qqq-option-alert:latest |"
            echo "| Commit | \`${{ github.sha }}\` |"
            echo "| 分支 | \`${{ github.ref_name }}\` |"
            echo ""
            echo "部署主机执行: \`docker compose pull && docker compose up -d\`"
          } >> "$GITHUB_STEP_SUMMARY"
